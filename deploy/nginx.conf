# Pliva River Lodge on our own server - nginx
#
# The site is plain static files (index.html at the root, img/ beside it)
# plus the small service in deploy/server.mjs, which answers the two
# form paths the page already uses.
#
# Install as /etc/nginx/sites-available/pliva-riverside and symlink it
# into sites-enabled. Replace every pliva.example with the real domain.

# ---------------------------------------------------------------- HTTP
# Everything is redirected to HTTPS, and ACME (the certificate renewal)
# is allowed through on port 80 so certbot can renew without downtime.
server {
    listen 80;
    listen [::]:80;
    server_name pliva.example www.pliva.example;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pliva;
        default_type "text/plain";
    }

    location / {
        return 301 https://pliva.example$request_uri;
    }
}

# ---------------------------------------------------------------- HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pliva.example www.pliva.example;

    # certbot writes these two lines. The certificate covers both names.
    ssl_certificate     /etc/letsencrypt/live/pliva.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pliva.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/plivariverlodge;
    index index.html;

    # The site is a git clone, so the repository is inside the web root.
    # It must never be readable from the web.
    location ~ /\.git {
        deny all;
    }

    # --- the headers Netlify was sending (_headers), now in nginx
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- the page itself: it holds the prices, so it must never be stale
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # --- the photos never change under the same name
    location /img/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # --- the enquiry form and the WhatsApp record
    location /.netlify/functions/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- the backup copy of a form (the same path Netlify watched)
    location = / {
        if ($request_method = POST) {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}

# --- www points at the same certificate; send it to the bare domain
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.pliva.example;

    ssl_certificate     /etc/letsencrypt/live/pliva.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pliva.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://pliva.example$request_uri;
}
